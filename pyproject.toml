[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lorawan-multinode-forecast"
version = "0.1.0"
description = "Reproducible multi-node RSSI forecasting benchmark"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
lora-benchmark = "src.cli.run_benchmark:main"
lora-prepare-uva = "src.cli.prepare_uva:main"

[tool.setuptools]
packages = ["src", "src.cli", "src.models"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
